<title>Trừ qua 10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one-screen app, a single centered column of big touch targets; screens swap in place. */
:root{
  --bg:#EEF3FB; --surface:#FFFFFF; --ink:#1D2742; --muted:#5D6A86; --line:#D5DDEC;
  --primary:#3566E8; --primary-ink:#FFFFFF; --primary-soft:#DCE6FF;
  --sun:#F5A700; --good:#1F9D62; --good-soft:#D6F3E4; --bad:#D9363E; --bad-soft:#FCE0E1;
  --warn:#D98200; --warn-soft:#FFEFCF; --none:#E6EAF2;
  --dot:#3566E8; --dot-x1:#F5A700; --dot-x2:#D9363E;
  --font:"Baloo 2", ui-rounded, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111727; --surface:#1B2337; --ink:#E9EEF8; --muted:#9AA6C2; --line:#2E3953;
  --primary:#6E95FF; --primary-ink:#0D1424; --primary-soft:#24315A;
  --sun:#FFC23D; --good:#3CCB86; --good-soft:#163A2A; --bad:#FF6B72; --bad-soft:#40202A;
  --warn:#FFB347; --warn-soft:#3D2E14; --none:#262F45;
  --dot:#6E95FF; --dot-x1:#FFC23D; --dot-x2:#FF6B72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111727; --surface:#1B2337; --ink:#E9EEF8; --muted:#9AA6C2; --line:#2E3953;
  --primary:#6E95FF; --primary-ink:#0D1424; --primary-soft:#24315A;
  --sun:#FFC23D; --good:#3CCB86; --good-soft:#163A2A; --bad:#FF6B72; --bad-soft:#40202A;
  --warn:#FFB347; --warn-soft:#3D2E14; --none:#262F45;
  --dot:#6E95FF; --dot-x1:#FFC23D; --dot-x2:#FF6B72; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px}
.screen{display:flex;flex-direction:column;gap:16px;flex:1}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.btn{border-radius:18px;padding:14px 20px;font-size:1.1rem;font-weight:700;background:var(--surface);border:2px solid var(--line);
  box-shadow:0 3px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);box-shadow:0 4px 0 color-mix(in srgb,var(--primary) 60%,#000)}
.btn.big{font-size:1.6rem;padding:18px 24px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.card{background:var(--surface);border-radius:22px;padding:18px;border:2px solid var(--line)}

/* Home */
.hero{text-align:center;padding-top:8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.hero .eq{font-size:3.2rem;font-weight:800;letter-spacing:.02em;color:var(--primary);font-variant-numeric:tabular-nums}
.hero h1{font-size:2rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border-radius:14px;padding:10px 8px;font-weight:700;font-size:1rem;background:var(--bg);border:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--ink)}
.label{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:14px}
.mastery{display:flex;flex-direction:column;gap:8px}
.bar{height:16px;border-radius:999px;background:var(--none);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}

/* Play */
.top{display:flex;align-items:center;gap:12px}
.top .x{font-size:1.3rem;width:44px;height:44px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:800}
.prog{flex:1;height:14px;border-radius:999px;background:var(--none);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.count{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.question{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:170px}
.qtext{font-size:clamp(3.4rem,16vw,5.6rem);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1;white-space:nowrap}
.qtext .ans{display:inline-block;min-width:1.1em;text-align:center;border-bottom:6px solid var(--line);color:var(--primary)}
.qtext.pop .ans{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}
.fb{min-height:2em;font-size:1.4rem;font-weight:800;text-align:center}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices button,.pad button{font-size:2.4rem;font-weight:800;border-radius:20px;background:var(--surface);border:2px solid var(--line);
  box-shadow:0 4px 0 var(--line);padding:10px 0;font-variant-numeric:tabular-nums;transition:transform .08s}
.choices button{padding:18px 0}
.choices button:active,.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pad button{font-size:2rem;padding:12px 0}
button.right{background:var(--good-soft)!important;border-color:var(--good)!important;color:var(--good)}
button.wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important;color:var(--bad)}
button:disabled{cursor:default}
.tools{display:flex;justify-content:center}
.hintbtn{font-weight:700;color:var(--muted);padding:8px 14px;border-radius:12px;font-size:1rem}
.hintbtn:hover{background:var(--surface)}

/* Hint panel */
.hint{background:var(--warn-soft);border:2px solid var(--warn);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.hint h3{font-size:1.15rem;color:var(--ink)}
.steps{display:flex;flex-direction:column;gap:4px;font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.steps .s1{color:var(--warn)} .steps .s2{color:var(--bad)}
.frames{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,22px);gap:5px;padding:7px;border-radius:10px;background:var(--surface);border:2px solid var(--line)}
.d{width:22px;height:22px;border-radius:50%;background:var(--dot);position:relative}
.d.empty{background:transparent;border:2px dashed var(--line)}
.d.x1{background:var(--dot-x1)} .d.x2{background:var(--dot-x2)}
.d.x1::after,.d.x2::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:3px;background:var(--ink);transform:rotate(-45deg);border-radius:2px}
.hint .note{font-size:1rem;color:var(--ink)}

/* Result */
.stars{font-size:3rem;text-align:center;letter-spacing:.1em;color:var(--sun)}
.stars .off{color:var(--none)}
.big-num{font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats .card{padding:12px 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--bad-soft);color:var(--bad)}

/* Parent */
.gridwrap{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:4px;margin:0 auto;font-variant-numeric:tabular-nums}
table.grid th{font-size:.85rem;color:var(--muted);font-weight:700;padding:2px}
table.grid td{width:52px;height:46px;border-radius:10px;text-align:center;font-size:.85rem;font-weight:700;line-height:1.05;padding:2px}
table.grid td.na{background:transparent}
.st-none{background:var(--none);color:var(--muted)}
.st-weak{background:var(--bad-soft);color:var(--bad)}
.st-mid{background:var(--warn-soft);color:var(--warn)}
.st-good{background:var(--good-soft);color:var(--good)}
table.grid td small{display:block;font-weight:600;font-size:.7rem;opacity:.85}
.weak-list{display:flex;flex-direction:column;gap:8px}
.weak-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--bg)}
.weak-item b{font-size:1.3rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.weak-item span{font-size:.95rem;color:var(--muted);text-align:right}
.explain{font-size:.95rem;color:var(--muted)}
.explain p{margin:0 0 6px}
.danger{color:var(--bad);border-color:var(--bad)}
.confirm{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app"></div>

<script>
(function(){
"use strict";
/* ---------- Facts: a − b with borrowing, a = 11..18, result < 10 ---------- */
var FACTS=[];
for(var a=11;a<=18;a++){for(var b=2;b<=9;b++){if(a-b<10)FACTS.push({a:a,b:b,k:a+"-"+b});}}

/* ---------- Storage (safe) ---------- */
var KEY="tru-qua-10-v1";
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.facts)return s;}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load()||{tick:0,facts:{},days:{},total:0,correct:0,settings:{mode:"choice",len:20,fast:4,sound:true}};
FACTS.forEach(function(f){if(!S.facts[f.k])S.facts[f.k]={lv:0,due:0,n:0,ok:0,wrong:0,t:[],last:0};});
S.settings=Object.assign({mode:"choice",len:20,fast:4,sound:true},S.settings||{});

/* Facts not seen for 2+ days come back for review */
(function(){var now=Date.now();FACTS.forEach(function(f){var st=S.facts[f.k];
  if(st.n&&now-st.last>2*864e5&&st.due>S.tick)st.due=S.tick;});})();

/* ---------- Spaced repetition ---------- */
var GAP=[2,4,8,15,30,60]; // questions until the fact returns, by level 0..5
function weight(st){var w=Math.pow(6-st.lv,2);if(!st.n)w=20;return w;}
function pick(lastK){
  var due=FACTS.filter(function(f){return f.k!==lastK&&S.facts[f.k].due<=S.tick;});
  if(!due.length){
    var rest=FACTS.filter(function(f){return f.k!==lastK;}).sort(function(x,y){return S.facts[x.k].due-S.facts[y.k].due;});
    due=rest.slice(0,4);
  }
  var tot=0;due.forEach(function(f){tot+=weight(S.facts[f.k]);});
  var r=Math.random()*tot;
  for(var i=0;i<due.length;i++){r-=weight(S.facts[due[i].k]);if(r<=0)return due[i];}
  return due[due.length-1];
}
function jitter(n){return n+Math.floor(Math.random()*Math.max(1,Math.round(n/4)));}
/* outcome: "wrong" | "slow" | "ok" | "fast" */
function record(f,outcome,ms){
  var st=S.facts[f.k];S.tick++;st.n++;st.last=Date.now();S.total++;
  if(outcome==="wrong"){st.wrong++;st.lv=st.lv>2?st.lv-2:0;st.due=S.tick+2;}
  else{
    st.ok++;S.correct++;st.t.push(ms);if(st.t.length>5)st.t.shift();
    if(outcome==="fast"){st.lv=Math.min(5,st.lv+1);st.due=S.tick+jitter(GAP[st.lv]);}
    else if(outcome==="ok"){st.due=S.tick+jitter(Math.max(3,Math.round(GAP[st.lv]/2)));}
    else{st.lv=Math.max(0,st.lv-1);st.due=S.tick+3;}
  }
  var d=new Date();var day=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  S.days[day]=(S.days[day]||0)+1;
  save();
}
function status(st){if(!st.n)return"none";if(st.lv>=4)return"good";if(st.lv>=1)return"mid";return"weak";}
function avg(t){if(!t.length)return null;var s=0;t.forEach(function(x){s+=x;});return s/t.length;}

/* ---------- Sound ---------- */
var AC=null;
function beep(good){
  if(!S.settings.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var notes=good?[660,880]:[300,220];
    notes.forEach(function(fr,i){var o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=fr;
      var t0=AC.currentTime+i*0.11;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.18,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+0.2);});
  }catch(e){}
}

/* ---------- Helpers ---------- */
var app=document.getElementById("app");
function h(html){app.innerHTML=html;}
function $(s){return app.querySelector(s);}
function $$(s){return Array.prototype.slice.call(app.querySelectorAll(s));}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var MINUS="−";

function choicesFor(f){
  var ans=f.a-f.b, ones=f.a-10, pool=[];
  var flip=Math.abs(f.b-ones); // common mistake: 13−5 → 5−3 = 2
  if(flip!==ans&&flip>=1)pool.push(flip);
  [ans+1,ans-1,ans+2,ans-2,ans+3].forEach(function(x){if(x>=1&&x<=10&&x!==ans&&pool.indexOf(x)<0)pool.push(x);});
  var first=pool.slice(0,1), rest=shuffle(pool.slice(1));
  return shuffle([ans].concat(first,rest).slice(0,4));
}

/* Ten-frame hint: a = 10 + ones; take away ones first, then the rest from the ten */
function hintHTML(f){
  var ones=f.a-10, rest=f.b-ones, ans=f.a-f.b;
  var ten="",unit="";
  for(var i=0;i<10;i++){var cls=i>=10-rest?"x2":"";ten+='<span class="d '+cls+'"></span>';}
  for(var j=0;j<10;j++){unit+=j<ones?'<span class="d x1"></span>':'<span class="d empty"></span>';}
  var steps;
  if(rest>0){
    steps='<div>Tách <b>'+f.b+'</b> = <span class="s1">'+ones+'</span> + <span class="s2">'+rest+'</span></div>'+
      '<div class="s1">'+f.a+' '+MINUS+' '+ones+' = 10</div>'+
      '<div class="s2">10 '+MINUS+' '+rest+' = '+ans+'</div>';
  }else{steps='<div>'+f.a+' '+MINUS+' '+f.b+' = '+ans+'</div>';}
  return '<div class="hint" role="note"><h3>Cách nghĩ: trừ cho tròn 10 trước</h3>'+
    '<div class="frames"><div class="frame">'+ten+'</div><div class="frame">'+unit+'</div></div>'+
    '<div class="steps">'+steps+'</div>'+
    '<div class="note">Còn lại <b>'+ans+'</b> chấm xanh. Vậy '+f.a+' '+MINUS+' '+f.b+' = <b>'+ans+'</b>.</div></div>';
}

/* ---------- Home ---------- */
function masteryCounts(){var c={none:0,weak:0,mid:0,good:0};FACTS.forEach(function(f){c[status(S.facts[f.k])]++;});return c;}
function home(){
  var c=masteryCounts(),N=FACTS.length,set=S.settings;
  function pct(x){return(x/N*100).toFixed(1)+"%";}
  h('<div class="screen">'+
    '<div class="hero"><div class="eq">13 '+MINUS+' 5 = 8</div><h1>Luyện trừ qua 10</h1>'+
    '<div class="muted">Hỏi lộn xộn. Phép nào con nghĩ lâu hay làm sai sẽ được hỏi lại nhiều hơn.</div></div>'+
    '<div class="card mastery"><div class="label">Con đã thuộc</div>'+
      '<div><span class="big-num">'+c.good+'</span><span class="muted"> / '+N+' phép trừ</span></div>'+
      '<div class="bar" aria-hidden="true"><i style="width:'+pct(c.good)+';background:var(--good)"></i><i style="width:'+pct(c.mid)+';background:var(--warn)"></i><i style="width:'+pct(c.weak)+';background:var(--bad)"></i></div>'+
      '<div class="legend"><span><i class="sw" style="background:var(--good)"></i>Thuộc '+c.good+'</span><span><i class="sw" style="background:var(--warn)"></i>Đang nhớ '+c.mid+'</span><span><i class="sw" style="background:var(--bad)"></i>Cần luyện '+c.weak+'</span><span><i class="sw" style="background:var(--none)"></i>Chưa làm '+c.none+'</span></div>'+
    '</div>'+
    '<div class="card stack">'+
      '<div><div class="label">Cách trả lời</div><div class="seg" id="mode">'+
        '<button data-v="choice" aria-pressed="'+(set.mode==="choice")+'">Chọn đáp án</button>'+
        '<button data-v="pad" aria-pressed="'+(set.mode==="pad")+'">Tự bấm số</button></div></div>'+
      '<div><div class="label">Số câu mỗi lượt</div><div class="seg three" id="len">'+
        [10,20,30].map(function(n){return'<button data-v="'+n+'" aria-pressed="'+(set.len===n)+'">'+n+' câu</button>';}).join("")+'</div></div>'+
    '</div>'+
    '<button class="btn primary big" id="go">Bắt đầu</button>'+
    '<div class="row" style="justify-content:space-between">'+
      '<button class="btn" id="parent">Bố mẹ xem tiến bộ</button>'+
      '<button class="btn" id="snd" aria-pressed="'+set.sound+'">'+(set.sound?"Âm thanh: bật":"Âm thanh: tắt")+'</button>'+
    '</div></div>');
  $$("#mode button").forEach(function(b){b.onclick=function(){set.mode=b.dataset.v;save();home();};});
  $$("#len button").forEach(function(b){b.onclick=function(){set.len=+b.dataset.v;save();home();};});
  $("#go").onclick=startRound;
  $("#parent").onclick=parent;
  $("#snd").onclick=function(){set.sound=!set.sound;save();home();};
}

/* ---------- Round ---------- */
var R=null;
function startRound(){R={i:0,len:S.settings.len,good:0,fast:0,missed:{},lastK:null};next();}
function next(){
  if(R.i>=R.len)return result();
  var f=pick(R.lastK);R.lastK=f.k;R.f=f;R.hinted=false;R.locked=false;R.retry=false;
  renderQ();
  R.t0=performance.now();
}
function renderQ(){
  var f=R.f,mode=S.settings.mode;
  var answers=mode==="choice"
    ?'<div class="choices" id="ans">'+choicesFor(f).map(function(n){return'<button data-v="'+n+'">'+n+'</button>';}).join("")+'</div>'
    :'<div class="pad" id="ans">'+[1,2,3,4,5,6,7,8,9,0].map(function(n){return'<button data-v="'+n+'">'+n+'</button>';}).join("")+'</div>';
  h('<div class="screen">'+
    '<div class="top"><button class="x" id="quit" aria-label="Dừng">✕</button>'+
      '<div class="prog"><i style="width:'+(R.i/R.len*100)+'%"></i></div><div class="count">'+(R.i+1)+'/'+R.len+'</div></div>'+
    '<div class="question"><div class="qtext" id="q">'+f.a+' '+MINUS+' '+f.b+' = <span class="ans" id="slot">?</span></div>'+
      '<div class="fb" id="fb" aria-live="polite"></div></div>'+
    '<div id="hintbox"></div>'+
    answers+
    '<div class="tools"><button class="hintbtn" id="hb">Con chưa nghĩ ra, gợi ý nhé</button></div>'+
    '</div>');
  $("#quit").onclick=home;
  $("#hb").onclick=function(){if(R.locked||R.hinted)return;R.hinted=true;$("#hintbox").innerHTML=hintHTML(R.f);$("#hb").hidden=true;};
  $$("#ans button").forEach(function(b){b.onclick=function(){answer(+b.dataset.v,b);};});
}
function answer(v,btn){
  if(R.locked)return;
  var f=R.f,ans=f.a-f.b,ms=performance.now()-R.t0;
  var slot=$("#slot"),fb=$("#fb");
  if(v===ans){
    R.locked=true;btn.classList.add("right");slot.textContent=ans;$("#q").classList.add("pop");beep(true);
    $$("#ans button").forEach(function(b){b.disabled=true;});
    if(R.retry){fb.className="fb good";fb.textContent="Đúng rồi! Nhớ nhé: "+f.a+" "+MINUS+" "+f.b+" = "+ans;setTimeout(advance,1500);return;}
    var fastMs=S.settings.fast*1000,outcome;
    if(R.hinted)outcome="slow";
    else if(ms<=fastMs)outcome="fast";
    else if(ms<=fastMs*2)outcome="ok";
    else outcome="slow";
    record(f,outcome,ms);R.good++;
    if(outcome==="fast")R.fast++;
    fb.className="fb good";
    fb.textContent=outcome==="fast"?"Giỏi quá! Nhanh như chớp!":outcome==="ok"?"Đúng rồi!":"Đúng rồi! Lần sau nhanh hơn nhé.";
    setTimeout(advance,outcome==="fast"?700:1000);
  }else{
    btn.classList.add("wrong");btn.disabled=true;beep(false);
    if(!R.retry){record(f,"wrong",ms);R.missed[f.k]=f;R.retry=true;}
    fb.className="fb bad";fb.textContent="Chưa đúng. Xem gợi ý rồi chọn lại nhé!";
    R.hinted=true;$("#hintbox").innerHTML=hintHTML(f);$("#hb").hidden=true;
  }
}
function advance(){R.i++;next();}

/* ---------- Result ---------- */
function result(){
  var n=R.len,g=R.good,ratio=g/n;
  var stars=ratio>=0.9?3:ratio>=0.7?2:ratio>=0.4?1:0;
  var missed=Object.keys(R.missed).map(function(k){return R.missed[k];});
  var c=masteryCounts();
  var msg=stars===3?"Tuyệt vời!":stars===2?"Giỏi lắm!":stars===1?"Cố lên, con đang tiến bộ!":"Mình luyện thêm nhé!";
  h('<div class="screen">'+
    '<div class="hero"><div class="stars" aria-label="'+stars+' sao">'+[0,1,2].map(function(i){return i<stars?"★":'<span class="off">★</span>';}).join("")+'</div>'+
    '<h1>'+msg+'</h1></div>'+
    '<div class="stats">'+
      '<div class="card"><div class="big-num" style="color:var(--good)">'+g+'</div><div class="muted">đúng ngay</div></div>'+
      '<div class="card"><div class="big-num" style="color:var(--primary)">'+R.fast+'</div><div class="muted">thật nhanh</div></div>'+
      '<div class="card"><div class="big-num">'+c.good+'</div><div class="muted">đã thuộc / '+FACTS.length+'</div></div>'+
    '</div>'+
    (missed.length?'<div class="card stack"><div class="label">Phép con cần nhớ thêm</div><div class="chips">'+
      missed.map(function(f){return'<span class="chip">'+f.a+' '+MINUS+' '+f.b+' = '+(f.a-f.b)+'</span>';}).join("")+
      '</div><div class="muted">Những phép này sẽ được hỏi lại sớm ở lượt sau.</div></div>':'')+
    '<button class="btn primary big" id="again">Chơi lượt nữa</button>'+
    '<button class="btn" id="home">Về trang đầu</button></div>');
  $("#again").onclick=startRound;$("#home").onclick=home;
}

/* ---------- Parent view ---------- */
function parent(){
  var rows="";
  for(var a=11;a<=18;a++){
    rows+='<tr><th>'+a+'</th>';
    for(var b=2;b<=9;b++){
      if(a-b>=10){rows+='<td class="na"></td>';continue;}
      var st=S.facts[a+"-"+b],s=status(st),av=avg(st.t);
      var sub=st.n?(st.wrong?"sai "+st.wrong:(av?(av/1000).toFixed(1)+"s":"")):"";
      rows+='<td class="st-'+s+'" title="'+a+' − '+b+': làm '+st.n+' lần, sai '+st.wrong+'">'+(a-b)+'<small>'+sub+'</small></td>';
    }
    rows+='</tr>';
  }
  var head='<tr><th>'+MINUS+'</th>'+[2,3,4,5,6,7,8,9].map(function(b){return'<th>'+b+'</th>';}).join("")+'</tr>';
  var weak=FACTS.filter(function(f){return S.facts[f.k].n>0;}).map(function(f){
      var st=S.facts[f.k],av=avg(st.t)||S.settings.fast*3000;
      return{f:f,st:st,av:av,score:(st.wrong/st.n)*3+av/(S.settings.fast*1000)-st.lv*0.4};})
    .filter(function(x){return status(x.st)!=="good"&&(x.st.wrong>0||x.av>S.settings.fast*1000);})
    .sort(function(x,y){return y.score-x.score;}).slice(0,8);
  var days=Object.keys(S.days).length;
  var acc=S.total?Math.round(S.correct/S.total*100):0;
  var set=S.settings;
  h('<div class="screen">'+
    '<div class="top"><button class="x" id="back" aria-label="Quay lại">←</button><h2 style="flex:1">Tiến bộ của con</h2></div>'+
    '<div class="stats">'+
      '<div class="card"><div class="big-num">'+S.total+'</div><div class="muted">câu đã làm</div></div>'+
      '<div class="card"><div class="big-num">'+acc+'%</div><div class="muted">đúng ngay</div></div>'+
      '<div class="card"><div class="big-num">'+days+'</div><div class="muted">ngày luyện</div></div>'+
    '</div>'+
    '<div class="card stack"><div class="label">Bảng 36 phép trừ</div>'+
      '<div class="muted" style="font-size:.95rem">Hàng là số bị trừ, cột là số trừ. Mỗi ô ghi kết quả, thời gian trả lời đúng trung bình và số lần sai.</div>'+
      '<div class="gridwrap"><table class="grid">'+head+rows+'</table></div>'+
      '<div class="legend"><span><i class="sw" style="background:var(--good)"></i>Thuộc</span><span><i class="sw" style="background:var(--warn)"></i>Đang nhớ</span><span><i class="sw" style="background:var(--bad)"></i>Cần luyện</span><span><i class="sw" style="background:var(--none)"></i>Chưa làm</span></div>'+
    '</div>'+
    '<div class="card stack"><div class="label">Phép con còn yếu</div>'+
      (weak.length?'<div class="weak-list">'+weak.map(function(x){
        return'<div class="weak-item"><b>'+x.f.a+' '+MINUS+' '+x.f.b+' = '+(x.f.a-x.f.b)+'</b><span>sai '+x.st.wrong+'/'+x.st.n+' lần'+(avg(x.st.t)?' · '+(avg(x.st.t)/1000).toFixed(1)+' giây':'')+'</span></div>';}).join("")+'</div>'
        :'<div class="muted">Chưa có phép nào bị sai hay nghĩ lâu. Nếu bảng còn nhiều ô xám, cho con làm thêm vài lượt nhé.</div>')+
    '</div>'+
    '<div class="card stack"><div class="label">Thế nào là “nhanh”</div>'+
      '<div class="seg three" id="fast">'+[3,4,5].map(function(n){return'<button data-v="'+n+'" aria-pressed="'+(set.fast===n)+'">≤ '+n+' giây</button>';}).join("")+'</div>'+
      '<div class="explain"><p>Trả lời đúng trong thời gian này: phép đó lên bậc và lâu sau mới hỏi lại.</p>'+
      '<p>Đúng nhưng chậm (quá gấp đôi thời gian trên) hoặc phải xem gợi ý: hạ một bậc, hỏi lại sau khoảng 3 câu.</p>'+
      '<p>Sai: hạ hai bậc, hỏi lại sau khoảng 2 câu, và con phải chọn lại đáp án đúng ngay lúc đó.</p>'+
      '<p>Một phép được tính là “thuộc” khi con trả lời đúng và nhanh khoảng 4 lần liên tiếp. Phép nào 2 ngày không gặp sẽ được ôn lại.</p></div>'+
    '</div>'+
    '<div class="card stack"><div class="label">Xóa dữ liệu</div><div class="confirm" id="resetbox">'+
      '<button class="btn danger" id="reset">Xóa toàn bộ tiến bộ</button></div>'+
      '<div class="muted" style="font-size:.9rem">Tiến bộ được lưu trên chính máy này, trong trình duyệt này.</div></div>'+
    '</div>');
  $("#back").onclick=home;
  $$("#fast button").forEach(function(b){b.onclick=function(){set.fast=+b.dataset.v;save();parent();};});
  $("#reset").onclick=function(){
    $("#resetbox").innerHTML='<span>Chắc chắn xóa hết?</span><button class="btn danger" id="yes">Xóa</button><button class="btn" id="no">Không</button>';
    $("#yes").onclick=function(){var keep=S.settings;S={tick:0,facts:{},days:{},total:0,correct:0,settings:keep};
      FACTS.forEach(function(f){S.facts[f.k]={lv:0,due:0,n:0,ok:0,wrong:0,t:[],last:0};});save();parent();};
    $("#no").onclick=parent;
  };
}

/* Keyboard: digits answer, Enter starts */
document.addEventListener("keydown",function(e){
  if(R&&$("#ans")&&/^[0-9]$/.test(e.key)){
    var b=$$("#ans button").filter(function(x){return x.dataset.v===e.key&&!x.disabled;})[0];
    if(b)b.click();
  }
});
home();
})();
</script>
